name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Python version (no dependencies should be installed)
        run: python -c "import sys; print(sys.version)"

      - name: All four modules import
        run: python -c "import texcheck, texstudio, fbxread, blendread; print('ok')"

      # NOTE: -W error::ResourceWarning does NOT fail the build. ResourceWarning
      # is raised in the file object's finalizer, where exceptions cannot
      # propagate, so Python prints "Exception ignored in:" and exits 0.
      # TestNoFileHandleLeaks is what actually catches leaks - it records
      # warnings around an explicit gc.collect() and asserts on them.
      - name: Run tests
        run: python -m unittest test_modelmap -v
