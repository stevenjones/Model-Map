name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.7 is the floor (ThreadingHTTPServer). Windows is included because the
        # README claims it "should work but is untested" - this is what turns that
        # into a tested claim, or tells us it doesn't.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: No dependencies should be needed
        run: python -c "import sys; print(sys.version)"

      - name: All four modules import
        run: python -c "import texcheck, texstudio, fbxread, blendread; print('ok')"

      - name: Run tests (ResourceWarning is an error)
        run: python -W error::ResourceWarning -m unittest test_modelmap -v
